name: Deploy Cloudflare Workers

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_AFDIAN_URL: ${{ vars.NEXT_PUBLIC_AFDIAN_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - name: Deploy commerce worker
        run: pnpm exec wrangler deploy --config workers/commerce/wrangler.jsonc --message "git:${GITHUB_SHA}" --tag "git-${GITHUB_SHA::12}"
      - name: Deploy AccessHub worker
        run: pnpm exec wrangler deploy --config dist/server/wrangler.json --message "git:${GITHUB_SHA}" --tag "git-${GITHUB_SHA::12}"
